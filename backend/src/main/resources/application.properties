spring.config.import=optional:file:./.env[.properties]

server.port=${port}

spring.datasource.url=${DBURL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Replace this development-only fallback with a secure secret in .env or APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:change-this-to-a-long-random-secret-key-12345}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

server.error.include-message=always
